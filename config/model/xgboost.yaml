model: xgboost

params: 
  _target_: xgboost.XGBClassifier
  n_estimators: 100
  max_depth: 6
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  random_state: 42
  objective: multi:softprob
  num_class: 7
  tree_method: hist
  random_state: ${seed}
  device: cuda:7

training:
  early_stopping_rounds: 50
  verbose: true
  use_eval_set: true